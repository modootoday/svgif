title: svgif.js
description: A scene graph and cameras, with frame-exact timelines and compositions. The render stays SVG. Studio is the primary action.
lang: en
# Canonical origin is https://thumly.io. www.thumly.io is not a second site. It redirects to the apex.
url: https://thumly.io
baseurl: ""
permalink: pretty
markdown: kramdown
sass:
  sourcemap: never
kramdown:
  input: GFM
remote_theme: modootoday/jekyll-theme-modootoday@v1.6.0
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
modootoday:
  nav: main
defaults:
  # The theme sidebar turns on for every doc page once the nav has a group.
  # Pages outside the docs tree keep the sidebar off.
  - scope:
      path: ""
    values:
      layout: doc
      lang: en
      sidebar: false
  - scope:
      path: docs
    values:
      layout: doc
      sidebar: true
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
