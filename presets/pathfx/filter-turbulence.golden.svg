    <animateTransform attributeName="transform" type="translate" begin="0s" dur="1s" calcMode="spline" values="0 0;0 -6;0 0;0 0" keyTimes="0;0.2667;0.7667;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" fill="remove" repeatCount="indefinite"/>
    <path id="s-filter-turbulence-shape" d="M 100 48 L 220 48 L 220 132 L 100 132 Z M 116 64 L 116 73 L 180 73 L 180 64 Z M 116 82 L 116 89 L 204 89 L 204 82 Z M 116 98 L 116 105 L 188 105 L 188 98 Z M 116 114 L 116 121 L 166 121 L 166 114 Z"/>
  </g>
</svg>