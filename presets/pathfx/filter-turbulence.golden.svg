<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <filter id="s-filter-turbulence-filter" x="-20%" y="-25%" width="140%" height="150%">
      <feTurbulence type="fractalNoise" numOctaves="2" seed="7" result="noise" baseFrequency="0.018">
        <animate attributeName="baseFrequency" begin="0s" dur="1s" calcMode="spline" values="0.018;0.03;0.018;0.018" keyTimes="0;0.2667;0.7667;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" fill="remove" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" xChannelSelector="R" yChannelSelector="G" scale="2">
        <animate attributeName="scale" begin="0s" dur="1s" calcMode="spline" values="2;14;2;2" keyTimes="0;0.2667;0.7667;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" fill="remove" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </defs>
  <g id="s-stage" fill="#141414">
