# Version updates. Security updates are a repository setting; see SECURITY.md
# and the one-time owner setup runbook. Dependabot is the only update bot.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: bundler
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      bundler:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
