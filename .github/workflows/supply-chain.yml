name: Supply chain

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review the dependency diff
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, LGPL-2.0, LGPL-2.1, LGPL-3.0, AGPL-3.0, SSPL-1.0
          # eventmachine is dual-licensed Ruby OR GPL-2.0. The build elects the Ruby license.
          # The action matches either identifier, so this one package is exempt from the license check only.
          allow-dependencies-licenses: pkg:gem/eventmachine@1.2.7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Audit lockfiles, signatures, and the theme pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/check-supply-chain.sh --self-test
          bash scripts/ci/check-supply-chain.sh
          bash scripts/ci/check-theme-ref.sh
          bash scripts/ci/install-osv-scanner.sh "$RUNNER_TEMP/osv-scanner"
          export PATH="$RUNNER_TEMP:$PATH"
          npm ci --ignore-scripts
          bash scripts/ci/npm-audit.sh
          python3 scripts/ci/osv_gate.py --self-test
          bash scripts/ci/scan-lockfiles.sh

  actions:
    name: Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zizmor.tar.gz" https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
          "$RUNNER_TEMP/zizmor" --offline .github/workflows

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  scorecard:
    name: Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    outputs:
      score: ${{ steps.score.outputs.score }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: true
      - id: score
        run: |
          score="$(python3 -c 'import json; print(json.load(open("results.json")).get("score", ""))')"
          echo "score=$score" >> "$GITHUB_OUTPUT"
          echo "scorecard score $score"

  track:
    name: Tracking issue
    needs: [dependencies, actions, codeql, scorecard]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the tracking issue and fail closed on high advisories
        env:
          GH_TOKEN: ${{ github.token }}
          DEP_RESULT: ${{ needs.dependencies.result }}
          ACT_RESULT: ${{ needs.actions.result }}
          QL_RESULT: ${{ needs.codeql.result }}
          SC_RESULT: ${{ needs.scorecard.result }}
          SCORECARD_SCORE: ${{ needs.scorecard.outputs.score }}
        run: |
          set +e
          advisory="$(bash scripts/ci/check-advisories.sh 2>&1)"
          advisory_code=$?
          set -e
          export ADVISORY_TEXT="$advisory"
          bash scripts/ci/update-supply-issue.sh
          if [ "$advisory_code" -ne 0 ]; then
            echo "$advisory"
            exit 1
          fi
          case "$DEP_RESULT$ACT_RESULT$QL_RESULT" in
            *failure*|*cancelled*) exit 1 ;;
          esac
