name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  line-endings:
    name: LF line endings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject CRLF in text files
        run: bash scripts/ci/check-lf.sh

  release-gate:
    name: Release gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Manifest, version rules, and workflow shape
        run: |
          node scripts/ci/check-release-readiness.mjs --self-test
          node scripts/ci/release-version.mjs --self-test
          bash scripts/ci/check-release-workflow.sh
          bash scripts/ci/check-package-name.sh
          bash scripts/ci/docs-ia.sh
          bash scripts/ci/check-supply-chain.sh --self-test
          bash scripts/ci/check-supply-chain.sh
          bash scripts/ci/check-advisories.sh --self-test
          node scripts/ci/render-agent-manifests.mjs --self-test
          node scripts/ci/render-agent-manifests.mjs
          node scripts/ci/install-from-repo.mjs --self-test
          node scripts/ci/install-from-repo.mjs --pin "$GITHUB_SHA"
          node scripts/ci/render-external-embed.mjs --self-test
          bash scripts/ci/check-dependency-allowlist.sh --self-test
          bash scripts/ci/check-dependency-allowlist.sh

  public-surface:
    name: Public surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mask deny terms
        env:
          SVGIF_DENY_TERMS: ${{ secrets.SVGIF_DENY_TERMS }}
          SVGIF_DENY_NAMES: ${{ secrets.SVGIF_DENY_NAMES }}
        run: python3 scripts/ci/public_surface.py --mask
      - name: Scan files, commits, and pull request text
        env:
          SVGIF_DENY_TERMS: ${{ secrets.SVGIF_DENY_TERMS }}
          SVGIF_DENY_NAMES: ${{ secrets.SVGIF_DENY_NAMES }}
          SVGIF_REQUIRE_DENY_TERMS: "true"
          SVGIF_PR_TITLE: ${{ github.event.pull_request.title }}
          SVGIF_PR_BODY: ${{ github.event.pull_request.body }}
          SVGIF_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SVGIF_LANDING: ${{ github.event_name == 'pull_request' && 'squash' || 'push' }}
        run: |
          bash scripts/ci/public-surface.sh --self-test
          bash scripts/ci/public-surface.sh

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  published-artifacts:
    name: Published artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Mask deny terms
        env:
          SVGIF_DENY_TERMS: ${{ secrets.SVGIF_DENY_TERMS }}
          SVGIF_DENY_NAMES: ${{ secrets.SVGIF_DENY_NAMES }}
        run: python3 scripts/ci/public_surface.py --mask
      - name: Build the docs site
        working-directory: docs
        run: |
          bundle exec jekyll build --destination _site
          find _site -name '*.map' -delete
      - name: Pack the workspace
        run: |
          npm ci --ignore-scripts
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
      - name: Reject internal trees, source maps, and deny terms
        env:
          SVGIF_DENY_TERMS: ${{ secrets.SVGIF_DENY_TERMS }}
          SVGIF_DENY_NAMES: ${{ secrets.SVGIF_DENY_NAMES }}
          SVGIF_REQUIRE_DENY_TERMS: "true"
        run: |
          bash scripts/ci/check-published-artifacts.sh --self-test
          tarball="$(find "$RUNNER_TEMP/pack" -name '*.tgz' | head -1)"
          bash scripts/ci/check-published-artifacts.sh docs/_site "$tarball"

  engine-tests:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Run engine tests
        working-directory: packages/svgif
        run: bun test

  export-pixels:
    name: Export pixels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install decode tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg webp google-chrome-stable
          # anim_dump and webpmux are files in the distro webp package
          # (noble 1.3.2 and resolute 1.5.0 both ship /usr/bin/anim_dump).
          # The distro chromium-browser package is a snap stub, so the
          # browser is the image's google-chrome-stable package. This step
          # exits 1 when any tool is missing. It does not skip the test.
          fail=0
          browser=""
          for name in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$name" >/dev/null 2>&1; then
              browser="$(command -v "$name")"
              break
            fi
          done
          if [[ -z "$browser" ]]; then
            echo "missing browser"
            fail=1
          else
            echo "browser ${browser}"
            "$browser" --version
          fi
          for tool in ffmpeg ffprobe anim_dump webpmux; do
            if ! path="$(command -v "$tool")"; then
              echo "missing ${tool}"
              fail=1
              continue
            fi
            echo "${tool} ${path}"
          done
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          anim_dump -version
          webpmux -version
          ffmpeg -version
          ffprobe -version
      - name: Run export tests
        working-directory: packages/svgif-export
        run: bun test

  studio-shell:
    name: Studio shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Detect the Studio package
        id: studio-package
        run: |
          if [ -f apps/studio/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/studio/package.json is absent; build and test skipped"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.studio-package.outputs.present == 'true'
        with:
          bun-version: "1.3.14"
      - name: Build and test Studio
        if: steps.studio-package.outputs.present == 'true'
        working-directory: apps/studio
        run: |
          bun run build
          bun test
      - name: Studio shell check
        run: bash scripts/ci/studio-shell.sh
