name: Pages

# Pull requests build the static site and do not deploy.
# Only a push to main uploads the artifact and deploys it.
# No step calls an encode server. url and baseurl stay in docs/_config.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@1287d2b408066abada82d5ad1c63652e758428d9 # v1.214.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build the docs site
        working-directory: docs
        run: bundle exec jekyll build --destination _site
      - name: Drop source maps
        working-directory: docs
        run: find _site -name '*.map' -delete
      - name: Check the Jekyll output
        working-directory: docs
        run: |
          commit="$(awk -F': ' '/^commit: /{print $2}' ../.github/supply-chain/theme-ref.txt)"
          case "$commit" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "theme pin is not a full commit SHA"; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/jekyll-theme-modootoday"
          rm -rf "$dest"
          git -c init.defaultBranch=main init "$dest"
          git -C "$dest" remote add origin https://github.com/modootoday/jekyll-theme-modootoday.git
          git -C "$dest" fetch --depth 1 origin "$commit"
          git -C "$dest" checkout --detach FETCH_HEAD
          test "$(git -C "$dest" rev-parse HEAD)" = "$commit"
          ruby "$dest/exe/modootoday-check" . _site
      - name: Copy the schema registry
        run: |
          if [ ! -d schema ]; then
            echo "schema/ is absent; registry copy skipped"
            exit 0
          fi
          mkdir -p docs/_site/schema
          rm -rf docs/_site/schema/svgif
          cp -a schema docs/_site/schema/svgif
          echo "copied schema/ to docs/_site/schema/svgif"
      - name: Detect the Studio package
        id: studio-package
        run: |
          if [ -f apps/studio/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/studio/package.json is absent; build skipped"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.studio-package.outputs.present == 'true'
        with:
          bun-version: "1.3.14"
      - name: Build Studio
        if: steps.studio-package.outputs.present == 'true'
        working-directory: apps/studio
        run: bun run build
      - name: Copy Studio when its build exists
        run: |
          if [ ! -d apps/studio/dist ]; then
            echo "apps/studio/dist is absent; docs placeholder stays"
            exit 0
          fi
          mkdir -p docs/_site
          rm -rf docs/_site/studio
          cp -a apps/studio/dist docs/_site/studio
      - name: Studio pages check
        run: bash scripts/ci/studio-pages-dod.sh docs/_site
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
