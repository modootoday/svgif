name: e2e

# Evidence producer for the release gate. This file does not upload a
# release-readiness artifact until the browser matrix exists. A green
# conclusion without that artifact is not evidence, and the release
# workflow rejects it.
on:
  workflow_dispatch:

permissions: {}

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Do not pretend the matrix ran
        run: |
          echo "The scenario matrix is not implemented in this commit."
          echo "Refusing to upload release-readiness."
          exit 1
