# git-cliff configuration. The changelog is generated from Conventional
# Commits and is not edited by hand. Section names are Keep a Changelog.
# A `Changelog: none` footer keeps a commit out of the notes.

[changelog]
header = """
# Changelog

All notable changes to this project are listed here. This file is generated by git-cliff.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { footer = "^Changelog: ?none", skip = true },
  { body = "(?m)^Changelog: ?none", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^revert", group = "<!-- 2 -->Removed" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^(docs|chore|ci|test|refactor|style|build)", skip = true },
]
